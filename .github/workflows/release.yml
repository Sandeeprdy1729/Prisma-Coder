name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - name: build sdist + wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: docker build (inference + verifier images)
        run: |
          docker build -f docker/Dockerfile -t prismacoder/inference:${{ github.ref_name }} .
          docker build -f docker/Dockerfile.verifier -t prismacoder/verifier:${{ github.ref_name }} .
      - name: smoke the verifier service
        run: |
          docker run -d --name verifier -p 9100:9100 prismacoder/verifier:${{ github.ref_name }}
          sleep 2
          curl -sf http://localhost:9100/health | tee /dev/stderr | grep -q '"ok"'
          docker rm -f verifier

  pypi:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  hub:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.HF_RELEASE == '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[hub]"
      - name: upload dataset + benchmark artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python utils/hf_upload.py dataset --dir datasets --repo prismacoder/PrismaForge
          python utils/hf_upload.py benchmark --dir benchmark/public --repo prismacoder/PrismaBench \
            --extra benchmark/README.md:README.md
