# PrismaCoder-3B - DPO stage (report Table 12.1 S2)
# 30k verifier-labeled pairs: chosen = gate-green candidate,
# rejected = strongest gate-failing candidate (same prompt, same sampler).
# beta 0.05; ref = S1 model; LR 5e-7; 1-2 epochs; bs 64; cosine 3% warmup.
run_name: prismacoder-3b-qlora-dpo
output_dir: runs/prismacoder-3b-qlora-dpo
seed: 20260830

model:
  name_or_path: runs/prismacoder-3b-qlora-sft/merged   # ref = S1 (merged SFT model)
  trust_remote_code: true
  torch_dtype: bfloat16
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: nf4
    bnb_4bit_use_double_quant: true
    bnb_4bit_compute_dtype: bfloat16

tokenizer:
  name_or_path: runs/prismacoder-3b-qlora-sft/merged
  max_seq_length: 4096

peft:
  task_type: CAUSAL_LM
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none

data:
  train_file: datasets/dpo_pairs.jsonl          # {prompt, context_schema, chosen, rejected, basis}
  validation_file: datasets/validation.jsonl
  format: dpo
  max_prompt_length: 2048
  max_completion_length: 2048

training:
  num_train_epochs: 1                  # 1-2 epochs; early stop on gate-profile regression
  learning_rate: 5.0e-7                # Table 12.1 S2
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 32      # global 64
  bf16: true
  tf32: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  max_grad_norm: 1.0
  beta: 0.05                           # DPO beta
  loss_type: sigmoid
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 200
  save_strategy: steps
  save_steps: 400
  save_total_limit: 3
  report_to: [tensorboard]

hub:
  push_to_hub: false
  repo_id: prismacoder/PrismaCoder-3B-DPO
  private: true
