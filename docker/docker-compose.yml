# PrismaCoder stack: api + postgres (V4 lane) + verifier sandbox.
version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: prismacoder/inference:latest
    environment:
      PRISMACODER_MODEL: ${PRISMACODER_MODEL:-prismacoder/PrismaCoder-3B}
      PRISMACODER_FULL_GATES: "1"
      VERIFY_POSTGRES_URL: postgresql://prisma:prisma@postgres:5432/prismacoder
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    image: prismacoder/inference:latest
    command: ["ui"]
    environment:
      PRISMACODER_MODEL: ${PRISMACODER_MODEL:-prismacoder/PrismaCoder-3B}
      GRADIO_SERVER_PORT: "7860"
    ports:
      - "7860:7860"
    depends_on:
      - api

  verifier:
    build:
      context: ..
      dockerfile: docker/Dockerfile.verifier
    image: prismacoder/verifier:latest
    ports:
      - "9100:9100"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: prismacoder
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
